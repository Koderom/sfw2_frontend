<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="Nuevo laboratorio" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="newLaboratorio()"/>
    </ng-template>
    <ng-template #end>
        <p-button label="Export" icon="pi pi-upload" severity="secondary"  (onClick)="exportCSV()"/>
    </ng-template>
</p-toolbar>

<p-table #dt 
  [value]="laboratorios()" 
  [rows]="10"
  [paginator]="true"
  [tableStyle]="{ 'min-width': '75rem' }"
  [rowHover]="true" dataKey="id"
  [globalFilterFields]="['paciente.nombre', 'codigo', 'fecha', 'tipoLaboratorio.descripcion', 'tipoControl.descripcion', 'tipoResultado.descripcion']"
  currentPageReportTemplate="mostrando {first} a {last} de {totalRecords} resultados"
  [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 30]">

  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">Lista de Laboratorios</h5>
      <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="paciente.nombre" style="min-width: 12rem">Paciente
        <p-sortIcon field="paciente" />
      </th>
      <th pSortableColumn="codigo" style="min-width: 10rem">Código
        <p-sortIcon field="codigo" />
      </th>
      <th pSortableColumn="fecha" style="min-width: 12rem">Fecha
        <p-sortIcon field="fecha" />
      </th>
      <th pSortableColumn="tipoLaboratorio.descripcion" style="min-width: 12rem">Tipo de Laboratorio
        <p-sortIcon field="tipoLaboratorio" />
      </th>
      <th pSortableColumn="tipoControl.descripcion" style="min-width: 12rem">Tipo de Control
        <p-sortIcon field="tipoControl" />
      </th>
      <th pSortableColumn="tipoResultado.descripcion" style="min-width: 12rem">Tipo de Resultado
        <p-sortIcon field="tipoResultado" />
      </th>
      <th style="min-width: 12rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-lab>
    <tr>
      <td>{{ lab.paciente?.nombre }}</td>
      <td>{{ lab.codigo }}</td>
      <td>{{ lab.fecha | date:'dd/MM/yyyy'}}</td>
      <td>{{ lab.tipoLaboratorio?.descripcion }}</td>
      <td>{{ lab.tipoControl?.descripcion }}</td>
      <td>{{ lab.tipoResultado?.descripcion }}</td>
      <td>
        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"/>
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"/>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-laboratorio-detail
    [visible]="laboratorioDialogVisible"
    [laboratorio]="laboratorioSeleccionado"
    [submitted]="laboratorioSubmitted()"
    (save)="onSaveLaboratorio()"
    (cancel)="onCancelDialogLaboratorio()"/>
