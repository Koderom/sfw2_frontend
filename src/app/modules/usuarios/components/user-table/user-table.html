<div class="card">
    <p-table 
        #dt 
        [value]="users" 
        [rows]="10" 
        [paginator]="true"
        [globalFilterFields]="['nombreUsuario', 'rol.descripcion']"
        [tableStyle]="{ 'min-width': '75rem' }"
        [loading]="loading"
        [rowHover]="true"
        dataKey="id"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
        [showCurrentPageReport]="true">

        <ng-template #caption>
          <div class="flex items-center justify-between">
            <h5 class="m-0">Gestionar Usuarios</h5>
            <div class="flex no-wrap gap-2">
              <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
              </p-iconfield>
              <p-button label="Nuevo" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="createUser()" />
            </div>
            
          </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="nombreUsuario" style="min-width: 200px">
                    Usuario
                    <p-sortIcon field="nombreUsuario"></p-sortIcon>
                </th>
                <th style="min-width: 150px">
                    Contraseña
                </th>
                <th pSortableColumn="rol.descripcion" style="min-width: 200px">
                    Rol
                    <p-sortIcon field="rol.descripcion"></p-sortIcon>
                </th>
                <th pSortableColumn="habilitado" style="min-width: 150px">
                    Estado
                    <p-sortIcon field="habilitado"></p-sortIcon>
                </th>
                <th style="min-width: 100px">
                    Acciones
                </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
            <tr>
                <td>
                    <span class="font-medium">{{user.username}}</span>
                </td>
                <td>
                    <span class="text-gray-600">{{hidePassword(user.contrasena)}}</span>
                </td>
                <td>
                    <span [class]="user.rol.descripcion === 'ADMIN' ? 'bg-primary-100 text-primary-700' : 'bg-surface-200 text-surface-700'"
                          class="px-2 py-1 rounded-md text-sm">
                        {{user.rol.descripcion}}
                    </span>
                </td>
                <td>
                    <span [class]="user.estado ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                          class="px-2 py-1 rounded-md text-sm">
                        {{user.estado ? 'Activo' : 'Inactivo'}}
                    </span>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button 
                            icon="pi pi-pencil" 
                            (click)="editUser(user)"
                            [rounded]="true" 
                            [text]="true" 
                            severity="success"
                            tooltip="Editar usuario">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">
                    <div class="flex flex-column align-items-center">
                        <i class="pi pi-users text-gray-400" style="font-size: 2rem"></i>
                        <span class="text-gray-400 mt-2">No se encontraron usuarios</span>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-user-detail 
        [visible]="showDialog" 
        [user]="selectedUser"
        (visibleChange)="onHideDialog()"
        (save)="onSave($event)">
    </app-user-detail>

    <p-confirmDialog header="Confirmación" icon="pi pi-exclamation-triangle"></p-confirmDialog>
</div>
