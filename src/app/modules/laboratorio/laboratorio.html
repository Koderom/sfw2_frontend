<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="Nuevo laboratorio" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="newLaboratorio()"/>
    </ng-template>
</p-toolbar>

<p-table #dt 
  [value]="laboratorios()" 
  [rows]="10"
  [paginator]="true"
  [tableStyle]="{ 'min-width': '75rem' }"
  [rowHover]="true" dataKey="id"
  currentPageReportTemplate="mostrando {first} a {last} de {totalRecords} resultados"
  [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 30]">

  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">Lista de Laboratorios</h5>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th style="width: 3rem">Paciente</th>
      <th style="min-width: 16rem">Código</th>
      <th style="min-width: 12rem">Fecha</th>
      <th style="min-width: 12rem">Tipo de Laboratorio</th>
      <th style="min-width: 12rem">Tipo de Control</th>
      <th style="min-width: 12rem">Tipo de Resultado</th>
      <th style="min-width: 12rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-lab>
    <tr>
      <td>{{ lab.paciente?.nombre }}</td>
      <td>{{ lab.codigo }}</td>
      <!-- <td>{{ lab.fecha | date: 'shortDate' }}</td> -->
      <td>{{ lab.fecha}}</td>
      <td>{{ lab.tipoLaboratorio?.descripcion }}</td>
      <td>{{ lab.tipoControl?.descripcion }}</td>
      <td>{{ lab.tipoResultado?.descripcion }}</td>
      <td>
        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"/>
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"/>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-laboratorio-detail
    [visible]="laboratorioDialogVisible"
    [laboratorio]="laboratorioSeleccionado"
    [submitted]="laboratorioSubmitted()"
    (save)="onSaveLaboratorio()"
    (cancel)="onCancelDialogLaboratorio()"/>
